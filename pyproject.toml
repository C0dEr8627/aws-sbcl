[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aws-sbcl-scraper"
version = "0.1.0"
description = "Local AWS Builder Center profile scraper for SBCL workflows"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "beautifulsoup4>=4.12,<5",
  "typer>=0.12,<1",
  "openpyxl>=3.1,<4",
]

[project.optional-dependencies]
test = [
  "pytest>=8,<9",
]

[project.scripts]
sbcl-scraper = "sbcl_scraper.cli:app"
sbcl-scraper-gui = "sbcl_scraper.gui:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
